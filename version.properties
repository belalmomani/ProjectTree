# المصدر الوحيد لأرقام الإصدارات.
# versionName = VERSION_PREFIX.BUILD   (مثال: 1.0.7)
# versionCode = CODE_OFFSET + BUILD    (يتزايد دائمًا)
# BUILD = رقم تشغيل GitHub Actions (run_number)، أو LOCAL_BUILD عند البناء المحلي.
# لرفع الإصدار الثانوي (1.1.x) غيّر VERSION_PREFIX فقط، ولا تنقص CODE_OFFSET أبدًا.
VERSION_PREFIX=1.0
CODE_OFFSET=0
LOCAL_BUILD=1
